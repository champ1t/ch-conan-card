<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07060f" />
  <meta name="description" content="CH.จุ่มการ์ดโคนัน — ร้านการ์ดสะสมโคนัน ซื้อการ์ด กล่อง แพ็ค ชม Live และดูไฮไลท์การเปิดการ์ด" />
  <title>CH.จุ่มการ์ดโคนัน — Official Card Store</title>

  <!-- SEO -->
  <meta property="og:title" content="CH.จุ่มการ์ดโคนัน — Official Card Store" />
  <meta property="og:description" content="ร้านการ์ดสะสมโคนัน ซื้อการ์ด กล่อง แพ็ค ชม Live และดูไฮไลท์" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://conancard.com/" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/home.css" />
  <link rel="stylesheet" href="css/pages/shop.css" />
  <link rel="stylesheet" href="css/pages/track.css" />
  <link rel="stylesheet" href="css/pages/daily.css" />
  <link rel="stylesheet" href="css/pages/admin.css" />
  <link rel="stylesheet" href="css/pages/tcg.css?v=5.2" />

  <style>
    /* Page transition */
    #main-view { animation: fadeIn .25s ease; }
    body { padding-top: var(--nav-h); }
    @media (max-width: 768px) { body { padding-top: var(--nav-h-mobile); } }
  </style>
</head>
<body>
  <!-- Navigation (mounted by nav.js) -->
  <header id="topnav" role="banner" aria-label="Navigation"></header>

  <!-- App root -->
  <div id="app">
    <!-- Initial loader -->
    <div id="initial-loader" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#07060f;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;transition:opacity 0.6s ease;">
      <img src="./img/loading.png" alt="Loading..." style="width:150px; height:auto; object-fit:contain; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; filter: drop-shadow(0 0 25px rgba(168,85,247,0.6));">
      <div class="loading-dots" style="transform:scale(1.3);"><span></span><span></span><span></span></div>
    </div>

    <!-- Main view (populated by router) -->
    <main id="main-view" role="main" aria-label="Main content" style="min-height:60dvh;"></main>
  </div>

  <!-- Mobile navigation (mounted by nav.js) -->
  <nav id="mobile-nav" role="navigation" aria-label="Mobile navigation"></nav>

  <!-- Toast container -->
  <div id="toast-container" aria-live="assertive" aria-atomic="false"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-panel" id="modal-panel"></div>
  </div>

  <!-- Bootstrap -->
  <script type="module">
    import { boot } from './js/app.js?v=5.2';
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await boot();
      } catch (err) {
        console.error('[Boot]', err);
        document.getElementById('initial-loader').innerHTML = `
          <div style="text-align:center;padding:40px 20px;">
            <div style="font-size:3rem;margin-bottom:16px;">⚠️</div>
            <div style="font-size:1.1rem;font-weight:700;color:#fda4af;margin-bottom:8px;">เกิดข้อผิดพลาด</div>
            <div style="color:rgba(255,255,255,.5);font-size:.85rem;margin-bottom:20px;">${err.message}</div>
            <button onclick="location.reload()" style="padding:10px 24px;border-radius:10px;background:#7c3aed;border:none;color:#fff;cursor:pointer;font-weight:700;">ลองใหม่</button>
          </div>
        `;
      }
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity .35s ease';
        setTimeout(() => loader.remove(), 360);
      }
    });
  </script>
</body>
</html>
